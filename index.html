<!DOCTYPE html>
<html>
<head>
    <title>Smart Student Placement System</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f6fc;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #153eaa;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Smart Student Placement</h1>

    <h2>Student Information</h2>

    <form id="studentForm">

        <label>Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>CGPA</label>
        <input type="number" id="cgpa" step="0.01" min="0" max="10" required>

        <label>Skills</label>
        <input type="text" id="skills" placeholder="Java, Python, HTML" required>

        <label>Internship</label>
        <select id="internship">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>

        <button type="submit">Add Student</button>

    </form>

    <div id="message"></div>

    <a href="/students" target="_blank">View Student Records</a>

</div>

<script>

document.getElementById("studentForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const student = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        cgpa: document.getElementById("cgpa").value,
        skills: document.getElementById("skills").value,
        internship: document.getElementById("internship").value
    };

    try {

        const response = await fetch("/addStudent", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(student)
        });

        const result = await response.text();

        document.getElementById("message").innerHTML = result;

        document.getElementById("studentForm").reset();

    } catch (error) {

        document.getElementById("message").innerHTML =
            "Error: Server is not running.";

    }

});

</script>

</body>
------
</html>
